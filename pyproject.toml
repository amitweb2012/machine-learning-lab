[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-lab"
version = "0.1.0"
description = "Portfolio-grade Machine Learning learning, experiments, and end-to-end projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Amit Das" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
